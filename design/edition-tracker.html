html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}

a{color:inherit}

.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.tag{width:26px;height:18px;background:var(--red);border-radius:3px 9px 9px 3px;position:relative;flex-shrink:0}

.updated{font-size:.88rem;color:var(--soft)}

.lede p{margin:0;font-size:1.05rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}

.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}

.list a:hover{background:var(--row)}

.list .dt{font-variant-numeric:tabular-nums;font-size:.95rem}
.list .dt span{display:block;font-size:.82rem;color:var(--soft)}
.thumb{width:72px;height:44px;flex-shrink:0;display:block}
.thumb svg,.hero svg{display:block;width:100%;height:100%}
.hero{background:var(--row);border-radius:6px;padding:18px 18px 8px;margin:0 0 14px}
.hero .art{max-width:420px;margin:0 auto;aspect-ratio:200/120}
.hero figcaption{font-size:.78rem;color:var(--soft);text-align:right;margin-top:4px}
.empty{color:var(--soft);padding:12px 8px;border-bottom:1px solid var(--line);margin:0}
.st{display:inline-block;font-size:.8rem;font-weight:700;padding:3px 9px;border-radius:4px;color:var(--c);background:var(--t);white-space:nowrap}

.back{display:inline-block;margin:18px 0 0;font-size:.92rem;color:var(--soft)}
.item h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:clamp(1.9rem,6vw,2.8rem);line-height:1.02;letter-spacing:-.01em;margin:10px 0 10px;max-width:22ch}
.sub{display:flex;flex-wrap:wrap;align-items:center;gap:10px;color:var(--soft);margin-bottom:18px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1.5px solid var(--ink);border-radius:6px;margin:0}
.facts div{padding:10px 12px;border-right:1px solid var(--line)}
.facts div:last-child{border-right:0}
.facts dt{font-size:.8rem;color:var(--soft)}
.facts dd{margin:0;font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums}
.countdown{margin:12px 0 0;font-weight:600}
.item h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:1.35rem;margin:30px 0 8px}
.item p{max-width:64ch;margin:0 0 10px}
.item ul.plain{margin:0;padding-left:20px}
.stores{width:100%;border-collapse:collapse}
.stores td{padding:10px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.stores tr:first-child td{border-top:1px solid var(--line)}
.stores td:last-child{text-align:right}
.stores a{font-weight:600;color:var(--red)}
.stores .na{color:var(--soft);font-size:.92rem}
.small{font-size:.86rem;color:var(--soft)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:6px 0}
.tl time{font-variant-numeric:tabular-nums;color:var(--soft);font-size:.92rem;padding-top:1px}
.src li{margin-bottom:4px}

footer{margin:56px 0 30px;padding-top:14px;border-top:1px solid var(--line);font-size:.86rem;color:var(--soft)}
footer p{margin:0 0 6px}

@media (max-width:600px){
  .list a{grid-template-columns:64px 1fr auto;gap:4px 12px}
  .thumb{width:64px;height:40px;grid-row:span 2}
  .list .nm{grid-column:2 / -1}
  .facts{grid-template-columns:1fr 1fr}
  .facts div:nth-child(2){border-right:0}
  .facts div:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .updated{display:none}

</style>

/* Simple drawings of each item type, tinted to the edition's colors. Not product photos. */
function art(spec) {
  const [k, a, b, c] = spec || ["mystery", "#888", "#aaa", "#333"];
  const S = inner => `<svg viewBox="0 0 200 120" role="img" aria-hidden="true">${inner}</svg>`;
  const shadow = `<ellipse cx="100" cy="110" rx="78" ry="5" fill="#000" opacity=".08"/>`;
  switch (k) {
    case "hybrid": return S(shadow + `
      <rect x="20" y="30" width="26" height="70" rx="12" fill="${a}"/><rect x="154" y="30" width="26" height="70" rx="12" fill="${a}"/>
      <rect x="44" y="30" width="112" height="70" rx="5" fill="${c}"/><rect x="50" y="36" width="100" height="58" rx="2" fill="#2A2F38"/>
      <path d="M50 36h40l-22 58H50z" fill="#fff" opacity=".06"/>
      <circle cx="33" cy="48" r="6" fill="${c}"/><circle cx="167" cy="76" r="6" fill="${c}"/>
      <g fill="${b}"><circle cx="167" cy="44" r="2.6"/><circle cx="173" cy="50" r="2.6"/><circle cx="161" cy="50" r="2.6"/><circle cx="167" cy="56" r="2.6"/>
      <rect x="30" y="68" width="6" height="16" rx="1"/><rect x="25" y="73" width="16" height="6" rx="1"/></g>
      <rect x="44" y="96" width="112" height="4" fill="${b}" opacity=".9"/>`);
    case "pad": return S(shadow + `
      <path d="M56 34h88c18 0 28 12 32 30l6 30c3 13-9 20-18 12l-16-16H52l-16 16c-9 8-21 1-18-12l6-30c4-18 14-30 32-30z" fill="${a}"/>
      <path d="M56 34h88c10 0 18 4 23 12H33c5-8 13-12 23-12z" fill="#fff" opacity=".18"/>
      <circle cx="74" cy="76" r="10" fill="${c}"/><circle cx="126" cy="76" r="10" fill="${c}"/>
      <circle cx="74" cy="76" r="6" fill="${b}"/><circle cx="126" cy="76" r="6" fill="${b}"/>
      <g fill="${c}"><rect x="46" y="50" width="6" height="18" rx="1"/><rect x="40" y="56" width="18" height="6" rx="1"/></g>
      <g fill="${b}"><circle cx="152" cy="50" r="3.4"/><circle cx="160" cy="58" r="3.4"/><circle cx="144" cy="58" r="3.4"/><circle cx="152" cy="66" r="3.4"/></g>
      <rect x="88" y="46" width="24" height="12" rx="3" fill="${b}" opacity=".85"/>`);
    case "case": return S(shadow + `
      <rect x="62" y="10" width="76" height="98" rx="4" fill="${a}"/>
      <rect x="62" y="10" width="76" height="16" rx="4" fill="${a}"/><rect x="62" y="20" width="76" height="6" fill="#000" opacity=".15"/>
      <rect x="70" y="32" width="60" height="62" rx="2" fill="${c}"/>
      <path d="M70 32h60v62z" fill="${b}" opacity=".55"/><path d="M78 32h14l-22 40V50z" fill="#fff" opacity=".35"/>
      <rect x="76" y="98" width="48" height="4" rx="2" fill="#fff" opacity=".5"/>`);
    case "mystery": return S(shadow + `
      <path d="M48 40l52-20 52 20v52l-52 18-52-18z" fill="${c}"/><path d="M48 40l52 18 52-18-52-20z" fill="${a}"/>
      <path d="M100 58v52l52-18V40z" fill="#000" opacity=".2"/>
      <text x="100" y="94" font-family="Barlow Condensed, sans-serif" font-weight="800" font-size="34" fill="${b}" text-anchor="middle">?</text>`);
    case "joycons": return S(shadow + `
      <rect x="62" y="16" width="30" height="88" rx="14" fill="${a}"/><rect x="108" y="16" width="30" height="88" rx="14" fill="${b}"/>
      <circle cx="76" cy="38" r="7" fill="#1B1D22"/><circle cx="123" cy="74" r="7" fill="#1B1D22"/>
      <g fill="${c}"><circle cx="123" cy="34" r="3"/><circle cx="130" cy="41" r="3"/><circle cx="116" cy="41" r="3"/><circle cx="123" cy="48" r="3"/>
      <rect x="73" y="62" width="6" height="18" rx="1"/><rect x="67" y="68" width="18" height="6" rx="1"/></g>`);
    case "figure": return S(shadow + `
      <ellipse cx="72" cy="100" rx="24" ry="7" fill="${c}"/><ellipse cx="128" cy="100" rx="24" ry="7" fill="${c}"/>
      <rect x="62" y="44" width="20" height="54" rx="10" fill="${a}"/><circle cx="72" cy="34" r="12" fill="${a}"/>
      <rect x="118" y="44" width="20" height="54" rx="10" fill="${b}"/><circle cx="128" cy="34" r="12" fill="${b}"/>
      <path d="M62 30c4-14 16-14 20 0z" fill="#fff" opacity=".2"/><path d="M118 30c4-14 16-14 20 0z" fill="#fff" opacity=".2"/>`);
    case "bricks": {
      const brick = (x, y, w, col) => `<rect x="${x}" y="${y}" width="${w}" height="18" rx="2" fill="${col}"/><rect x="${x}" y="${y + 14}" width="${w}" height="4" fill="#000" opacity=".15"/>` +
        Array.from({ length: Math.floor(w / 16) }, (_, i) => `<rect x="${x + 4 + i * 16}" y="${y - 5}" width="9" height="5" rx="1" fill="${col}"/>`).join("");
      return S(shadow + brick(44, 88, 112, c) + brick(52, 66, 64, a) + brick(116, 66, 32, b) + brick(68, 44, 48, b) + brick(84, 22, 32, a));
    }
    case "tower": return S(shadow + `
      <rect x="66" y="8" width="68" height="98" rx="4" fill="${a}" opacity=".55"/><rect x="66" y="8" width="68" height="98" rx="4" fill="none" stroke="${a}" stroke-width="2"/>
      <g opacity=".75" fill="${b}"><rect x="74" y="30" width="52" height="8" rx="1"/><rect x="74" y="44" width="34" height="20" rx="1"/><rect x="112" y="44" width="14" height="44" rx="1"/><rect x="74" y="70" width="34" height="18" rx="1"/></g>
      <ellipse cx="100" cy="16" rx="26" ry="4" fill="${c}" opacity=".8"/><circle cx="76" cy="98" r="3" fill="${c}"/>
      <path d="M70 12h18L72 100h-2z" fill="#fff" opacity=".18"/>`);
    case "keyboard": return S(`<ellipse cx="100" cy="104" rx="88" ry="5" fill="#000" opacity=".08"/>
      <rect x="10" y="44" width="150" height="56" rx="6" fill="${a}" opacity=".7"/><rect x="10" y="44" width="150" height="56" rx="6" fill="none" stroke="${a}" stroke-width="2"/>
      ${Array.from({ length: 4 }, (_, r) => Array.from({ length: 12 }, (_, i) => `<rect x="${17 + i * 11.6}" y="${50 + r * 11.5}" width="9" height="9" rx="1.5" fill="${b}"/>`).join("")).join("")}
      <path d="M168 62c0-10 8-16 14-16s14 6 14 16v18c0 12-6 20-14 20s-14-8-14-20z" fill="${a}" opacity=".75"/><path d="M182 46v20" stroke="${b}" stroke-width="2"/>`);
    case "dock": return S(shadow + `
      <path d="M40 74h120l8 30H32z" fill="${a}" opacity=".7"/><path d="M40 74h120l8 30H32z" fill="none" stroke="${a}" stroke-width="2"/>
      <path d="M58 30h30c8 0 12 6 14 14l2 30H48l2-30c2-8 4-14 8-14z" fill="${b}"/><path d="M112 30h30c4 0 6 6 8 14l2 30H96l2-30c2-8 6-14 14-14z" fill="${b}"/>
      <circle cx="132" cy="96" r="3" fill="${c}"/><circle cx="68" cy="96" r="3" fill="${c}"/>`);
    case "phonepad": return S(shadow + `
      <rect x="20" y="40" width="34" height="56" rx="14" fill="${a}"/><rect x="146" y="40" width="34" height="56" rx="14" fill="${a}"/>
      <rect x="50" y="42" width="100" height="52" rx="8" fill="${b}"/><rect x="56" y="47" width="88" height="42" rx="4" fill="#2A2F38"/>
      <circle cx="37" cy="58" r="6" fill="${b}"/><circle cx="163" cy="78" r="6" fill="${b}"/>
      <g fill="${c}"><circle cx="163" cy="54" r="2.6"/><circle cx="169" cy="60" r="2.6"/><circle cx="157" cy="60" r="2.6"/></g>`);
    case "handheld": return S(shadow + `
      <path d="M30 34h140c12 0 18 10 18 22v26c0 14-8 22-20 22-8 0-12-4-18-10H50c-6 6-10 10-18 10-12 0-20-8-20-22V56c0-12 6-22 18-22z" fill="${a}"/>
      <path d="M30 34h140c8 0 14 4 16 12H14c2-8 8-12 16-12z" fill="#fff" opacity=".08"/>
      <rect x="52" y="38" width="96" height="56" rx="3" fill="#0B0D12"/><path d="M52 38h36L66 94H52z" fill="#fff" opacity=".06"/>
      <circle cx="34" cy="56" r="8" fill="${c}"/><circle cx="34" cy="56" r="8" fill="none" stroke="${b}" stroke-width="1.5"/>
      <circle cx="166" cy="78" r="8" fill="${c}"/><circle cx="166" cy="78" r="8" fill="none" stroke="${b}" stroke-width="1.5"/>
      <g fill="${b}"><circle cx="166" cy="50" r="2.6"/><circle cx="172" cy="56" r="2.6"/><circle cx="160" cy="56" r="2.6"/><circle cx="166" cy="62" r="2.6"/></g>`);
    case "ps5": return S(shadow + `
      <path d="M70 8c-6 0-10 4-10 10v80c0 6 4 10 10 10h6V8z" fill="${a}"/><path d="M130 8c6 0 10 4 10 10v80c0 6-4 10-10 10h-6V8z" fill="${a}"/>
      <rect x="76" y="8" width="48" height="100" rx="3" fill="${b}"/>
      <path d="M64 30l14-10M62 40l16-12M138 70l-14 10M140 80l-16 12" stroke="${c}" stroke-width="3" stroke-linecap="round"/>
      <rect x="84" y="20" width="32" height="3" rx="1.5" fill="${c}"/>`);
  }
  return "";
}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toDate = d => new Date(d + "T12:00:00");
const short = d => toDate(d).toLocaleDateString("en-US", { month: "short", day: "numeric" });
const long = d => toDate(d).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
const when = i => i.date ? long(i.date) : (i.when || "TBA");
const daysOut = d => { const t = new Date(); t.setHours(12,0,0,0); return Math.round((toDate(d) - t) / 86400000); };
const chip = s => `<span class="st" style="--c:var(--c-${STATUS[s].c});--t:var(--t-${STATUS[s].c})">${STATUS[s].label}</span>`;
const isOut = i => i.status === "out" || i.status === "soldout" || (i.date && daysOut(i.date) < 0);

let filter = "all";

function rowHTML(i) {
  let sub = "";
  if (i.date && !isOut(i)) { const n = daysOut(i.date); sub = n === 0 ? "today" : n === 1 ? "tomorrow" : `in ${n} days`; }
  return `<li><a href="#/item/${encodeURIComponent(i.id)}">
    <span class="thumb">${art(i.art)}</span>
    <span class="nm">${esc(i.name)}<span class="pf">${esc(i.platform)}, ${esc(i.price)}</span></span>
    <span class="dt">${i.date ? (isOut(i) ? long(i.date) : short(i.date)) : esc(i.when || "TBA")}${sub ? `<span>${sub}</span>` : ""}</span>
    <span>${chip(i.status)}</span></a></li>`;
}

function section(title, note, list) {
  return `<h2 class="sec">${title}${note ? ` <small>${note}</small>` : ""}</h2>
    <ul class="list">${list.length ? list.map(rowHTML).join("") : `<li><p class="empty">Nothing here right now.</p></li>`}</ul>`;
}

function home() {
  const pool = ITEMS.filter(i => filter === "all" || i.cat === filter);
  const byDate = (a, b) => (a.date || "9999") .localeCompare(b.date || "9999");
  const coming = pool.filter(i => i.status !== "rumor" && !isOut(i)).sort(byDate);
  const rumors = pool.filter(i => i.status === "rumor");
  const out = pool.filter(i => i.status !== "rumor" && isOut(i)).sort((a, b) => byDate(b, a));
  document.title = "Edition Tracker: special edition consoles, controllers and collectibles";
  const chips = [["all", "Everything"]].concat(Object.entries(CATS))
    .map(([k, v]) => `<button type="button" data-cat="${k}" aria-pressed="${filter === k}">${v}</button>`).join("");
  $("#app").innerHTML = `
    <div class="lede"><p>Special edition consoles, controllers and collectibles: when they come out, what they cost, and where to look. I update this as news drops.</p></div>
    <div class="chips" role="group" aria-label="Filter by category">${chips}</div>
    ${section("Coming up", "", coming)}
    ${rumors.length ? section("Rumors and leaks", "not confirmed", rumors) : ""}
    ${out.length ? section("Already out", "", out) : ""}`;
  document.querySelectorAll(".chips button").forEach(b => b.addEventListener("click", () => { filter = b.dataset.cat; home(); }));
}

function item(i) {
  const n = i.date ? daysOut(i.date) : null;
  const cd = n > 1 ? `Out in ${n} days.` : n === 1 ? "Out tomorrow." : n === 0 ? "Out today." : "";
  const stores = i.stores.map(s => {
    const [key, state] = Array.isArray(s) ? s : [s, "ok"];
    const [name, url, isSearch] = STORES[key];
    const href = isSearch ? url + encodeURIComponent(i.q) : url;
    return `<tr><td>${esc(name)}</td><td>${state === "na" ? `<span class="na">Not listed yet</span>` : `<a href="${esc(href)}" target="_blank" rel="noopener">Check stock</a>`}</td></tr>`;
  }).join("");
  document.title = `${i.name}: price, release date, where to buy | Edition Tracker`;
  $("#app").innerHTML = `<article class="item">
    <a class="back" href="#/">Back to all releases</a>
    <h1>${esc(i.name)}</h1>
    <div class="sub"><span>${esc(i.platform)}</span>${chip(i.status)}</div>
    <figure class="hero" style="margin:0 0 14px"><div class="art">${art(i.art)}</div><figcaption>Illustration, not a product photo</figcaption></figure>
    <dl class="facts">
      <div><dt>Price</dt><dd>${esc(i.price)}</dd></div>
      <div><dt>Release</dt><dd>${esc(when(i))}</dd></div>
      <div><dt>Preorders opened</dt><dd>${i.pre ? long(i.pre) : "No"}</dd></div>
      <div><dt>Category</dt><dd>${CATS[i.cat]}</dd></div>
    </dl>
    ${cd && !isOut(i) ? `<p class="countdown">${cd}</p>` : ""}
    <h2>Notes</h2>${i.notes.map(p => `<p>${esc(p)}</p>`).join("")}
    ${i.box.length ? `<h2>What's in the box</h2><ul class="plain">${i.box.map(b => `<li>${esc(b)}</li>`).join("")}</ul>` : ""}
    <h2>Where to buy</h2>
    <table class="stores"><tbody>${stores}</tbody></table>
    <p class="small">Links open the store's search. Stock changes by the hour on these, so check before you head out.</p>
    ${i.timeline.length ? `<h2>Timeline</h2>
    <ul class="tl">${[...i.timeline].sort((a, b) => b[0].localeCompare(a[0])).map(([d, t]) => `<li><time datetime="${d}">${long(d)}</time><span>${esc(t)}</span></li>`).join("")}</ul>` : ""}
    <h2>Sources</h2>
    <ul class="plain src">${i.sources.map(([l, u]) => `<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(l)}</a></li>`).join("")}</ul>
  </article>`;
}

function route() {
  const m = location.hash.match(/^#\/item\/(.+)$/);
  const i = m && ITEMS.find(x => x.id === decodeURIComponent(m[1]));
  i ? item(i) : home();
  window.scrollTo(0, 0);
}
$("#updated").textContent = "Updated " + long(UPDATED);
window.addEventListener("hashchange", route);
route();
</script>
