# Builds the site from data/releases.json and publishes it to GitHub Pages.
# Runs on every change to main, and once a day so "in N days" and the
# Coming up / Already out sections stay current for search engines.
name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    # Just after midnight New York time, so the header shows the new day.
    # 4:07 UTC is 12:07am in summer, 5:07 UTC is 12:07am in winter. GitHub
    # often starts schedules late, so there are a couple of extra tries.
    - cron: "7 4,5,6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Emails alert subscribers about what changed, once the new pages are live.
  # Needs the BUTTONDOWN_API_KEY repository secret (and Buttondown's Tags add-on);
  # without the secret it only logs what it would have sent.
  # Put [no alerts] in a commit message to skip sending for that push.
  alerts:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Make sure every alert tag exists in Buttondown
        run: node scripts/alerts.mjs sync-tags
      - name: Send alerts for this change
        if: github.event_name == 'push'
        run: node scripts/alerts.mjs send "${{ github.event.before }}"
