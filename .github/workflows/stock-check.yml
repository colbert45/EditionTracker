# Checks Best Buy's stock every 5 minutes for the releases in config/stock-check.json. When one comes back, it starts
# "Post a restock", which puts it on the site, emails the people following it, posts it, and redeploys.
# Needs the BESTBUY_API_KEY secret (free key from developer.bestbuy.com). Without it, this does nothing.
# To see what Best Buy says for each product without changing anything: Actions > Best Buy stock check > Run workflow > tick "Just show".
# The last answers are kept on the "stock-state" branch, so the first check only sets a starting point.
name: Best Buy stock check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      show:
        description: "Just show what Best Buy says, start nothing"
        type: boolean
        default: false

permissions:
  contents: write # keeps the last answers on the stock-state branch
  actions: write # starts "Post a restock"

concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Without the secret every step is skipped, so the 10-minute schedule costs nothing until the key is added.
      HAS_KEY: ${{ secrets.BESTBUY_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: env.HAS_KEY == 'true'
        with:
          node-version: 22
      - name: Get the last answers
        if: env.HAS_KEY == 'true'
        run: |
          mkdir -p .stock-state
          git fetch --depth=1 origin stock-state 2>/dev/null && git show FETCH_HEAD:bestbuy.json > .stock-state/bestbuy.json || echo "No earlier answers yet."
      - name: Check Best Buy
        id: check
        if: env.HAS_KEY == 'true'
        env:
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          SHOW: ${{ inputs.show }}
        run: |
          if [ "$SHOW" = "true" ]; then node scripts/stock-check.mjs --show; else node scripts/stock-check.mjs; fi
      - name: Keep the answers
        if: env.HAS_KEY == 'true' && steps.check.outputs.state_changed == 'true'
        run: |
          BLOB=$(git hash-object -w .stock-state/bestbuy.json)
          TREE=$(printf '100644 blob %s\tbestbuy.json\n' "$BLOB" | git mktree)
          COMMIT=$(GIT_AUTHOR_NAME=github-actions[bot] GIT_AUTHOR_EMAIL=41898282+github-actions[bot]@users.noreply.github.com GIT_COMMITTER_NAME=github-actions[bot] GIT_COMMITTER_EMAIL=41898282+github-actions[bot]@users.noreply.github.com git commit-tree "$TREE" -m "Best Buy stock answers")
          git push -f origin "$COMMIT:refs/heads/stock-state"
